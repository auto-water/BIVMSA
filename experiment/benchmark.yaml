# BIV benchmark manifest
#
# Ground truth label defaults to the path segment (benign/ or malware/). Entries
# here (a) document each registered case's expected label + note, and (b) override
# the derived label when the path has no label segment (e.g. a flat 8000-sample dump).
#
# Paths are relative to experiment/cases/ and use POSIX separators.
# Auto-register new datasets with: python scripts/register_dataset.py --dataset <name>

